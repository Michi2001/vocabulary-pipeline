# Test configuration for pipeline integration test

corpora:
  - name: "sample"
    file_path: "test/data/sample_corpus.txt"
    type: "opus"
    encoding: "utf-8"

lemmatization:
  model: "es_core_news_lg"
  batch_size: 100

processing:
  sentence_batch_size: 100

output:
  directory: "test/outputs"
  min_frequency: 1

cache:
  directory: "test/cache"
  llm_directory: "test/cache/llm_results"

filtering:
  # POS tags: NOUN, VERB, ADJ, ADV, ADP, CONJ, AUX, CCONJ, SCONJ, PROPN, DET, PRON, NUM, etc.
  accepted_pos:
    - NOUN
    - VERB
    - ADJ
    - ADV
    - ADP
    - CONJ
    - AUX     # Mapped to VERB
    - CCONJ   # Mapped to CONJ
    - SCONJ   # Mapped to CONJ
    - PRON
    - INTJ
    - NUM
  pos_mappings:
    AUX: VERB
    CCONJ: CONJ
    SCONJ: CONJ
  include_countries: true

llm_correction:
  enabled: true
  batch_size: 10
  target_output_size: 50
  prompt_file: "prompts/correction/general_prompt.txt"
  llm:
    type: "google"
    google:
      model: "gemini-3-flash-preview"
      max_retries: 3
      retry_delay: 2
      timeout: 60
      temperature: 1.0
      thinking_level: "minimal"

llm_translation:
  enabled: true
  batch_size: 20
  prompt_directory: "prompts/translation_v2"
  max_requests_per_minute: 20    # 0 = unlimited; Gemini 3 Pro: max 25 RPM, Gemini 3 flash: max 1k
  max_concurrent_requests: 20     # Concurrent API requests
  llm:
    type: "google"
    google:
      model: "gemini-3-flash-preview"
      max_retries: 3
      retry_delay: 2
      timeout: 360
      temperature: 1.0
      thinking_level: "minimal"

# Example Generation runs automatically when disambiguation.enabled=true
example_generation:
  batch_size: 20
  prompt_directory: "prompts/examples"
  num_examples_poly: 10
  llm:
    type: "google"
    google:
      model: "gemini-3-flash-preview"
      max_retries: 3
      retry_delay: 2
      timeout: 360
      temperature: 1.0
      thinking_level: "minimal"

disambiguation:
  enabled: true
  model: "dccuchile/bert-base-spanish-wwm-cased"
  batch_size: 8
